name: CI

on:
  push:
    branches: [main, master, 'feature/**', 'feat/**', 'fix/**', 'refactor/**', 'infra/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Atlas.Blazor/package-lock.json

      - name: Restore
        run: dotnet restore Atlas.sln

      - name: Atlas 2 TypeScript
        working-directory: src/Atlas.Blazor
        run: |
          npm ci
          npm run typecheck
          npm run test:js
          npm run build:js

      - name: Build
        run: dotnet build Atlas.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Atlas.sln --no-build --no-restore --configuration Release --verbosity normal

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'
      - run: dotnet restore Atlas.sln
      - run: dotnet format Atlas.sln --verify-no-changes --no-restore --verbosity minimal

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Atlas.Blazor/package-lock.json
      - run: dotnet restore Atlas.sln
      - run: npm ci
        working-directory: src/Atlas.Blazor
      - run: npm run build:js
        working-directory: src/Atlas.Blazor
      # Single-package distribution (ADR-0019): only Atlas.Blazor is packed;
      # it embeds Atlas.Core.dll. The version is pinned to match
      # samples/Atlas.Demo/Directory.Packages.props so the consumer
      # verification below exercises the exact package the demo resolves.
      - run: dotnet pack src/Atlas.Blazor/Atlas.Blazor.csproj --no-restore --configuration Release --output artifacts/packages -p:PackageVersion=0.2.0

      # Consumer verification (ADR-0017/0019): the freshly packed package must
      # be consumable by the independent NuGet consumer sample (restore from
      # the local source, build, test, format). NuGet.Config uses forward-slash
      # paths so the same file works on Linux and Windows.
      - name: Verify Demo consumes the packed package
        working-directory: samples/Atlas.Demo
        run: |
          dotnet restore Atlas.Demo.sln --configfile NuGet.Config
          dotnet build Atlas.Demo.sln --no-restore
          dotnet test Atlas.Demo.sln --no-build --no-restore
          dotnet format Atlas.Demo.sln --verify-no-changes --no-restore
