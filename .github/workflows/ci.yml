name: CI

on:
  push:
    branches: [main, master, 'feature/**', 'feat/**', 'fix/**', 'refactor/**', 'infra/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Atlas.Blazor/package-lock.json

      - name: Restore
        run: dotnet restore Atlas.sln

      - name: Atlas 2 TypeScript
        working-directory: src/Atlas.Blazor
        run: |
          npm ci
          npm run typecheck
          npm run test:js
          npm run build:js

      - name: Build
        run: dotnet build Atlas.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Atlas.sln --no-build --no-restore --configuration Release --verbosity normal

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - run: dotnet restore Atlas.sln
      - run: dotnet format Atlas.sln --verify-no-changes --no-restore --verbosity minimal

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Atlas.Blazor/package-lock.json
      - run: dotnet restore Atlas.sln
      - run: npm ci
        working-directory: src/Atlas.Blazor
      - run: npm run build:js
        working-directory: src/Atlas.Blazor
      # Single-package distribution (ADR-0019): only Atlas.Blazor is packed;
      # it embeds Atlas.Core.dll. The version is pinned to match the
      # published release so consumers (e.g. the DbcView sample application)
      # resolve the exact package Atlas ships.
      - run: dotnet pack src/Atlas.Blazor/Atlas.Blazor.csproj --no-restore --configuration Release --output artifacts/packages -p:PackageVersion=0.2.0
