name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'samples/Atlas.Showcase/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      # atlas.js is a gitignored build artifact. A clean checkout contains
      # only atlas.css, so the bundle must be generated before publish;
      # without npm the csproj target warns and continues, silently shipping
      # a bundle-less package. Run the real JS pipeline explicitly.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Atlas.Blazor/package-lock.json

      - name: Build Atlas TypeScript bundle
        working-directory: src/Atlas.Blazor
        run: |
          npm ci
          npm run build:js

      # Atlas.Showcase is the in-repo teaching demo. The deploy resolves the
      # exact source revision of this branch — the Pages site always reflects
      # the checked-out Atlas source, not a local pack or cache.
      - name: Publish showcase
        run: |
          dotnet publish samples/Atlas.Showcase/Atlas.Showcase.csproj \
            --configuration Release \
            --output publish/showcase

      - name: Verify bundle is present in publish output
        run: |
          test -f publish/showcase/wwwroot/_content/Atlas.Blazor/atlas-v2/atlas.js \
            && echo "atlas.js present"

      # GitHub Pages project site maps the deployed artifact root to the
      # /Atlas/ subpath, so the staged root must BE the site: no extra
      # Atlas/ directory (that would serve /Atlas/Atlas/...). The dev
      # index.html keeps base href="/" so local `dotnet run` works; the
      # deployed copy must resolve assets from /Atlas/.
      - name: Rewrite base href for the /Atlas/ subpath
        run: |
          sed -i 's|<base href="/" />|<base href="/Atlas/" />|' publish/showcase/wwwroot/index.html
          grep -q '<base href="/Atlas/" />' publish/showcase/wwwroot/index.html \
            && echo "base href rewritten to /Atlas/"

      - name: Stage site (artifact root maps to /Atlas/)
        run: |
          mkdir -p site
          cp -r publish/showcase/wwwroot/. site/

      # GitHub Pages runs Jekyll on project-site branches unless told not to;
      # without .nojekyll the _framework/ directory is dropped and the site
      # renders blank. The SPA fallback serves index.html for unknown paths so
      # direct navigation to /verification works on refresh.
      - name: Add .nojekyll and SPA fallback
        run: |
          touch site/.nojekyll
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
