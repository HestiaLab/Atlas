name: Publish GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的包版本，例如 0.4.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack and publish Atlas.Blazor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Atlas.Blazor/package-lock.json

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi
          grep -q -- "-p:PackageVersion=$VERSION" .github/workflows/ci.yml
          grep -q "Version=\"$VERSION\"" src/Atlas.Blazor/package-readme.md
          echo "Publishing Atlas.Blazor $VERSION"

      - name: Restore
        run: dotnet restore Atlas.sln

      - name: Build TypeScript bundle
        working-directory: src/Atlas.Blazor
        run: |
          npm ci
          npm run typecheck
          npm run test:js
          npm run build:js

      - name: Build and test
        run: |
          dotnet build Atlas.sln --no-restore --configuration Release
          dotnet test Atlas.sln --no-build --no-restore --configuration Release

      - name: Pack
        run: |
          dotnet pack src/Atlas.Blazor/Atlas.Blazor.csproj \
            --no-restore \
            --configuration Release \
            --output artifacts/packages \
            -p:PackageVersion="$VERSION"

      - name: Inspect package
        run: |
          nupkg="artifacts/packages/Atlas.Blazor.$VERSION.nupkg"
          test -f "$nupkg"
          unzip -l "$nupkg"
          sha256sum "$nupkg"

      - name: Publish to HestiaLab GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/packages/Atlas.Blazor.$VERSION.nupkg" \
            --source "https://nuget.pkg.github.com/HestiaLab/index.json" \
            --api-key "$GITHUB_TOKEN"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas.Blazor.${{ inputs.version }}
          path: artifacts/packages/Atlas.Blazor.${{ inputs.version }}.nupkg
          if-no-files-found: error
