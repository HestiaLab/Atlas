<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>P7 sandbox child</title></head>
<body>
  <p data-testid="p7-sandbox-child">Sandbox content</p>
  <script>
    let parentDomBlocked = false;
    try {
      void parent.document.querySelector("[data-testid=p7-demo-host]").textContent;
    } catch (error) {
      parentDomBlocked = error?.name === "SecurityError";
    }
    document.body.dataset.parentDomBlocked = String(parentDomBlocked);
    const ready = {
      type: "atlas-sandbox-ready",
      protocolVersion: 1,
      workspaceId: "p7-demo",
      itemId: "sandbox",
      generation: 1
    };
    parent.postMessage(ready, "*");
    window.addEventListener("message", event => {
      if (event.data === "send-unknown") {
        parent.postMessage({ ...ready, type: "unknown-command" }, "*");
      } else if (event.data === "send-oversized") {
        parent.postMessage({ ...ready, padding: "x".repeat(5000) }, "*");
      }
    });
  </script>
</body>
</html>
